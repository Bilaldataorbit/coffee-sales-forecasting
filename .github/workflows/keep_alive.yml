name: Keep Streamlit app awake
on:
  schedule:
    - cron: "0 */8 * * *"
  workflow_dispatch:
jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install playwright
          playwright install chromium --with-deps
      - run: python scripts/keepalive.py
